worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 🚀 修复点 1：动态判断连接类型。只有客户端带有 Upgrade 头时，才转发给后端，否则保持 close/keep-alive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 🚀 修复点 2：增加 max_fails=0，防止后端因为瞬间高并发被 Nginx 误判宕机而拉黑 503
    upstream backend_service {
        server backend:3456 max_fails=0;
    }

    upstream auth_service {
        server 127.0.0.1:8080;
    }

    server {
        listen 3456;
        server_name localhost;
        absolute_redirect off; 

        # 内部鉴权接口
        location = /auth-validate {
            internal;
            proxy_pass http://auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # 1. 前端网关自带的静态资源
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        # 2. 登录页面
        location = /login.html {
            root /usr/share/nginx/html;
            try_files /static/login.html =404;
        }

        # 3. 认证 API
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
        }

        # 🚀 修复点 3：单独抽出所有静态文件路由
        # 这样它们不会带上 WebSocket 的 Upgrade 头，也不会引发协议崩溃
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|map)$ {
            # 同样开启鉴权（如果你希望连 JS 都受保护）
            auth_request /auth-validate;
            error_page 401 = @handle_401;
            error_page 403 = @handle_403;

            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # 关闭代理缓存并清理可能的连接头
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }

        # 4. 默认路由 (仅处理 HTML 页面、API 和 WebSocket 通信)
        location / {
            auth_request /auth-validate;
            error_page 401 = @handle_401;
            error_page 403 = @handle_403;

            proxy_pass http://backend_service;
            
            proxy_http_version 1.1;
            # 使用最上方定义的 map 变量
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location @handle_401 {
            return 302 /login.html?redirect=$request_uri;
        }

        location @handle_403 {
            return 302 /login.html?change_password=true;
        }
    }
}